spring.application.name=atletismo-api
# --- App ---
server.port=8080

# --- Perfil activo ---
# Carga adicionalmente application-local.properties (que NO esta en Git)
spring.profiles.active=local

# --- JPA ---
# validate = no crea tablas, solo valida que existan (Flyway las crea)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
